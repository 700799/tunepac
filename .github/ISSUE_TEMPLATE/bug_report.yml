name: Bug report
description: Something fails or behaves wrongly.
labels: [bug]
body:
  - type: textarea
    id: config
    attributes:
      label: Your config
      description: The YAML you ran, with any secrets removed.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: validate
    attributes:
      label: Output of `tunepac validate --config <your config>`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `tunepac --version && python --version && pip freeze | grep -iE 'torch|transformers|trl|peft|bitsandbytes'`, plus GPU model if training.
      render: text
    validations:
      required: true
