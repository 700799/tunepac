name: Release

# Publishes to PyPI when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Authenticates via PyPI Trusted Publishing (OIDC) — no API token is stored
# anywhere. PyPI matches the OIDC claim field by field, so the publisher
# registered there must say exactly:
#   owner 700799 · repository tunepac · workflow release.yml · environment pypi
# "Workflow name" there is this file's name, not the `name:` above it.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Never ship a tag whose code doesn't pass its own gates.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tunepac; print(tunepac.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $pkg"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check metadata renders on PyPI
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment gives you an optional manual approval gate before
    # anything reaches PyPI; a PyPI upload cannot be undone. The name must
    # match the environment on the PyPI publisher registration.
    environment: pypi
    permissions:
      # Mint the short-lived OIDC token PyPI verifies. This is the only
      # permission the job needs; everything else drops to none, and
      # download-artifact resolves same-run artifacts through the Actions
      # runtime token rather than GITHUB_TOKEN.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
